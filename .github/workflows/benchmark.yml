# Đo chất lượng (BLEU/chrF trên FLORES-200) và tốc độ (giây/trang, tăng tốc int8) trên CPU.
name: Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/benchmark.py
      - .github/workflows/benchmark.yml

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      PDFTR_DATA_DIR: ${{ github.workspace }}/bench-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện (torch CPU để đo fp32 và chuyển đổi int8)
        run: |
          pip install -r requirements.txt -r requirements-ml.txt sacrebleu
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            bench-data/models
          key: bench-models-v1

      - name: Tải tập thử FLORES-200 devtest và bài báo mẫu
        run: |
          curl -sSL -o flores.tar.gz https://dl.fbaipublicfiles.com/nllb/flores200_dataset.tar.gz
          mkdir flores && tar xzf flores.tar.gz -C flores --wildcards '*eng_Latn.devtest' '*vie_Latn.devtest'
          cp "$(find flores -name 'eng_Latn.devtest')" eng.devtest
          cp "$(find flores -name 'vie_Latn.devtest')" vie.devtest
          wc -l eng.devtest vie.devtest
          curl -sSL -o attention.pdf https://arxiv.org/pdf/1706.03762v7

      - name: Công thức → LaTeX và chồng lấn trên attention.pdf
        env:
          PDFTR_ENABLE_MOCK: "1"
        run: |
          for pg in 3 4 5; do python -m app.inspect attention.pdf --page $pg --math; done | tee math.log
          python -m app.cli attention.pdf -e mock -o mathout --no-bilingual 2>&1 | tee -a math.log
          echo "Số cảnh báo chồng lấn khi dịch: $(grep -c 'chồng lên' math.log || true)"
          grep -o '\$[^$]\{4,120\}\$' mathout/attention_vi.md | head -40


        run: python scripts/convert_ct2.py vinai

      - name: So các cách áp thuật ngữ (tắt / codeswitch / token)
        run: |
          cat > try.txt <<'TXT'
          2.2.4 Loss Function Design
          3.6 Computational Efficiency
          2.1 Pseudo-Ground-Truth (pGT) Surface Generation
          We minimize the loss function with stochastic gradient descent.
          The learning rate and batch size were tuned on the validation set.
          We compare a convolutional neural network with a random forest and a support vector machine.
          The attention mechanism improves feature extraction from the feature map.
          Results were statistically significant compared with the control group (p < 0.05).
          Smith et al. reported a lower bound on the time complexity of the algorithm.
          The covariance matrix is estimated by maximum likelihood estimation.
          The ground truth surfaces were generated from the training data with transfer learning.
          The thermal conductivity of the thin film was measured by X-ray diffraction.
          TXT
          python scripts/benchmark.py --engine vinai --terms --try try.txt \
            --src eng.devtest --ref vie.devtest --json terms.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Đo
        # Đo đầy đủ (~10 phút) khi chạy tay, hoặc khi commit có "[đo]" trong nội dung
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[đo]')
        run: |
          python scripts/benchmark.py --engine vinai \
            --src eng.devtest --ref vie.devtest \
            --speed-n 100 --pdf attention.pdf --json benchmark.json | tee bench.log
          sed -n '/^### /,$p' bench.log >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: |
            benchmark.json
            benchmark.hyp.txt
            terms.json
            math.log
            mathout/attention_vi.md
            mathout/attention_vi.docx
            mathout/attention_vi.pdf
